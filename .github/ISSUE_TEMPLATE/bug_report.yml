name: Bug report
description: Report a reproducible AgentUsageMonitor problem without sharing private data
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not attach credentials, callback URLs,
        prompts, responses, private source code, raw provider output, session logs,
        or unredacted diagnostics.
  - type: input
    id: version
    attributes:
      label: App version and build
      description: Find these in Settings → Diagnostics.
      placeholder: "0.0.1 (266)"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 15.6"
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - OpenAI Codex
        - Claude Code
        - Both providers
        - Not provider-specific
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Menu-bar item
        - Popover
        - Settings
        - Notifications
        - Connection or setup
        - Token Monitor
        - Build or installation
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use sanitized values and include the smallest repeatable sequence.
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Describe the visible result without pasting raw logs or private data.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, callback URLs, account identifiers, private paths, prompts, responses, private source code, and raw session or diagnostic records.
          required: true
